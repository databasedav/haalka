[workspace]
resolver = "2"

[package]
name = "haalka"
version = "0.7.1"
edition = "2024"
categories = ["asynchronous", "gui", "game-development"]
description = "ergonomic reactive Bevy UI library powered by FRP signals"
exclude = [".github/", ".vscode/"]
keywords = ["ui", "reactive", "signals", "gamedev", "bevy"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/databasedav/haalka"
documentation = "https://docs.rs/haalka"

[dependencies]
bevy_app = { version = "0.20", default-features = false }
bevy_camera = { version = "0.20", optional = true, default-features = false }
bevy_derive = { version = "0.20", default-features = false }
bevy_ecs = { version = "0.20", default-features = false, features = ["multi_threaded"] }
bevy_input = { version = "0.20", default-features = false }
bevy_input_focus = { version = "0.20", optional = true, default-features = false, features = ["bevy_picking"] }
bevy_log = { version = "0.20", default-features = false }
bevy_math = { version = "0.20", default-features = false }
bevy_picking = { version = "0.20", default-features = false }
bevy_platform = { version = "0.20", default-features = false }
bevy_reflect = { version = "0.20", default-features = false }
bevy_render = { version = "0.20", default-features = false, features = ["webgl"] }
bevy_tasks = { version = "0.20", default-features = false, features = ["multi_threaded"] }
bevy_text = { version = "0.20", default-features = false }
bevy_time = { version = "0.20", default-features = false }
bevy_transform = { version = "0.20", default-features = false }
bevy_ui = { version = "0.20", default-features = false }
bevy_ui_render = { version = "0.20", optional = true, default-features = false }
bevy_utils = { version = "0.20", default-features = false }
bevy_window = { version = "0.20", default-features = false }
bevy_winit = { version = "0.20", default-features = false, features = ["x11"] }
bevy_ui_widgets = { version = "0.20", default-features = false, optional = true }
jonmo = { git = "https://github.com/databasedav/jonmo", rev = "b75730527afd70d386722da898cf71c7ce050e04" }
apply = "0.3"
cfg-if = "1.0"
enclose = "1.2"
paste = { version = "1.0", optional = true }
document-features = { version = "0.2", optional = true }
# aalo = { path = "../aalo", version = "0.0", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy_winit = { version = "0.20", optional = true }
bevy_audio = { version = "0.20", optional = true }
bevy_core_pipeline = { version = "0.20", optional = true, default-features = false, features = ["webgl"] }
bevy_pbr = { version = "0.20", optional = true, default-features = false, features = ["webgl"] }
bevy_gizmos = { version = "0.20", optional = true, default-features = false }
bevy_sprite = { version = "0.20", optional = true, default-features = false}

[features]
default = [
    "text_input",
    "derive",
    "utils",
]

## Bevy-native text input widget integrated with signals.
text_input = ["derive", "bevy_input_focus", "bevy_ui_widgets"]

## Macro ([`impl_haalka_methods!`](https://docs.rs/haalka/latest/haalka/macro.impl_haalka_methods.html)) for deriving convenience methods for modifying components on custom element structs with static values, functions, or signals.
derive = ["paste", "bevy_camera"]

## Utilities for working with async.
utils = []

## `DebugUiPlugin` which toggles Bevy's [`GlobalUiDebugOptions`](https://docs.rs/bevy/latest/bevy/ui_render/debug_overlay/struct.GlobalUiDebugOptions.html) with the `F1` key; requires a camera marked with [`IsDefaultUiCamera`](https://docs.rs/bevy/latest/bevy/camera/struct.IsDefaultUiCamera.html).
debug = ["bevy_ui_render/bevy_ui_debug"]

deployed_wasm_example = []

[dev-dependencies]
bevy = "0.20"
bevy_asset_loader = { version = "0.28", features = ["2d"] }
# TODO version 0.8 breaks valid html colors ?
colorgrad = "0.7"
rand = "0.10"
strum = { version = "0.27", features = ["derive"] }
# TODO: version 0.5 is kinda overcomplicated and broken ? https://github.com/coriolinus/calc/issues/28
calc = { version = "0.4", default-features = false }
rust_decimal = "1.39"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies.bevy_rand]
version = "0.16"
features = ["wyrand"]

[target.'cfg(target_arch = "wasm32")'.dev-dependencies.bevy_rand]
version = "0.16"
features = ["wyrand", "wasm_js"]

[package.metadata.cargo-all-features]
allowlist = [
    "text_input",
    "derive",
    "utils",
    "debug",
]

[package.metadata.docs.rs]
cargo-args = ["-Zunstable-options", "-Zrustdoc-scrape-examples"]
no-default-features = true
features = ["text_input", "derive", "utils", "debug", "document-features"]

[lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[[example]]
name = "align"
path = "examples/align.rs"
doc-scrape-examples = true
# TODO: relying on the features here for `cargo run --example ...` enables moving the
# examples/utils.rs to src/utils.rs behind a feature flag; this already works for building docs
# requires https://github.com/rust-lang/cargo/issues/4663#issue-268904412
# required-features = ["examples", "debug"]

