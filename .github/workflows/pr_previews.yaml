# generated by nickel/pr_previews.ncl; do not manually edit
concurrency:
  cancel-in-progress: true
  group: pr-preview-${{ github.event.number }}
jobs:
  assert_nickels_synced:
    name: assert nickels synced
    runs-on: ubuntu-latest
    steps:
    - name: checkout repo
      uses: actions/checkout@v4
      with:
        persist-credentials: false
        submodules: true
    - name: install nickel
      run: |-
        OUT="$HOME/.local/bin/nickel"
        mkdir -p "$(dirname "$OUT")"
        curl -L "https://github.com/tweag/nickel/releases/download/1.12.2/nickel-pkg-x86_64-linux" -o "$OUT"
        chmod +x "$OUT"
        echo "$(dirname "$OUT")" >> "$GITHUB_PATH"
        nickel --version
    - name: install just
      uses: extractions/setup-just@v2
    - name: assert nickels synced
      run: |-
        just format_nickels sync_nickels
        [[ -n $(git status --porcelain) ]] && echo 'nickels are not synced; run `just format_nickels sync_nickels`' && exit 1 || exit 0
  build_examples:
    name: build examples
    needs: get_examples
    strategy:
      matrix:
        api:
        - webgl2
        - webgpu
        example: ${{ fromJson(needs.get_examples.outputs.examples) }}
    uses: ./.github/workflows/build_example.yaml
    with:
      api: ${{ matrix.api }}
      example: ${{ matrix.example }}
  get_examples:
    name: get examples
    needs: assert_nickels_synced
    outputs:
      examples: ${{ steps.output_examples.outputs.examples }}
    runs-on: ubuntu-latest
    steps:
    - name: checkout repo
      uses: actions/checkout@v4
      with:
        persist-credentials: false
        submodules: true
    - name: install just
      uses: extractions/setup-just@v2
    - id: output_examples
      name: list examples
      run: |-
        examples=$(just list_examples)
        echo "examples=$examples"
        echo "examples=$examples" >> $GITHUB_OUTPUT
name: pr previews
on: pull_request
