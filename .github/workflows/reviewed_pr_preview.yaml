# generated by nickel/reviewed_pr_preview.ncl; do not manually edit
concurrency:
  cancel-in-progress: true
  group: ${{ github.event.review.body == '/deploy' && format('pr-preview-{0}', github.event.pull_request.number) || format('non-deploy-review-{0}', github.run_id) }}
jobs:
  authorize:
    if: github.event.review.body == '/deploy' && github.event.review.state == 'commented' && github.event.review.user.login == github.actor && github.event.review.commit_id == github.event.pull_request.head.sha
    name: authorize
    outputs:
      pr: ${{ github.event.pull_request.number }}
      ref: ${{ github.event.review.commit_id }}
      repository: ${{ github.event.pull_request.head.repo.full_name }}
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
    - name: verify reviewer permission
      uses: actions/github-script@v7
      with:
        script: |-
          async function canDeployPreview(username) {
            const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username,
            });
            return ['admin', 'write'].includes(data.user.permission)
              || ['admin', 'maintain', 'write'].includes(data.user.role_name);
          }
          if (!(await canDeployPreview(context.actor))) {
            core.setFailed(`${context.actor} does not have permission to deploy pull request previews.`);
          }
    - env:
        PR: ${{ github.event.pull_request.number }}
        REF: ${{ github.event.review.commit_id }}
        REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        REVIEWER: ${{ github.event.review.user.login }}
        REVIEW_ID: ${{ github.event.review.id }}
      name: write preview request
      run: |-
        jq -n \
          --argjson pr "$PR" \
          --arg ref "$REF" \
          --arg repository "$REPOSITORY" \
          --argjson review_id "$REVIEW_ID" \
          --arg reviewer "$REVIEWER" \
          '{pr: $pr, ref: $ref, repository: $repository, review_id: $review_id, reviewer: $reviewer}' \
          > preview-request.json
    - name: upload preview request
      uses: actions/upload-artifact@v4
      with:
        name: preview-request
        path: preview-request.json
        retention-days: 1
  build_examples:
    name: build examples
    needs:
    - authorize
    - get_examples
    permissions:
      contents: read
    strategy:
      matrix:
        api:
        - webgl2
        - webgpu
        example: ${{ fromJson(needs.get_examples.outputs.examples) }}
    uses: ./.github/workflows/build_example.yaml
    with:
      api: ${{ matrix.api }}
      example: ${{ matrix.example }}
      ref: ${{ needs.authorize.outputs.ref }}
      repository: ${{ needs.authorize.outputs.repository }}
  get_examples:
    name: get examples
    needs: authorize
    outputs:
      examples: ${{ steps.output_examples.outputs.examples }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
    - name: checkout repo
      uses: actions/checkout@v4
      with:
        persist-credentials: false
        ref: ${{ needs.authorize.outputs.ref }}
        repository: ${{ needs.authorize.outputs.repository }}
        submodules: true
    - name: install just
      uses: extractions/setup-just@v2
    - id: output_examples
      name: list examples
      run: |-
        examples=$(just list_examples)
        echo "examples=$examples"
        echo "examples=$examples" >> $GITHUB_OUTPUT
name: reviewed pr preview
on:
  pull_request_review:
    types:
    - submitted
