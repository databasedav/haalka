# generated by nickel/cleanup_pr_previews.ncl; do not manually edit
env:
  PR: ${{ github.event.pull_request.number }}
jobs:
  cancel_deployments:
    concurrency:
      cancel-in-progress: true
      group: pr-preview-${{ github.event.pull_request.number }}
    name: cancel deployments
    permissions: {}
    runs-on: ubuntu-latest
    steps:
    - name: cancel in-progress preview deployments
      run: 'true'
  cleanup:
    concurrency:
      cancel-in-progress: true
      group: pr-preview-cleanup-${{ github.event.pull_request.number }}
    name: cleanup
    needs: cancel_deployments
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
    - name: checkout repo
      uses: actions/checkout@v4
      with:
        persist-credentials: false
        submodules: true
    - name: make empty dir
      run: mkdir -p empty_dir
    - name: cleanup
      uses: JamesIves/github-pages-deploy-action@v4.7.3
      with:
        attempt-limit: 100
        commit-message: cleaning up pr preview for https://github.com/databasedav/haalka/pull/${{ env.PR }}
        folder: empty_dir
        single-commit: true
        target-folder: pr_previews/${{ env.PR }}
name: cleanup pr previews
on:
  pull_request_target:
    types:
    - closed
